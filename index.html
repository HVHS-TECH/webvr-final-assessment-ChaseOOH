<!DOCTYPE html>
<html>
  <head>
    <title>CUH CUUUHH in the sky</title>
    <script src="https://aframe.io/releases/1.1.0/aframe.min.js"></script>
    <script src="https://rawgit.com/donmccurdy/aframe-extras/v2.1.1/dist/aframe-extras.loaders.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Sky and lighting -->
      <a-sky color="lightblue"></a-sky>
      <a-entity light="type: ambient; intensity: 0.5"></a-entity>
      <a-entity light="type: directional; intensity: 0.8" position="1 1 0"></a-entity>

      <a-entity
        ply-model="src: CUH_CUUUH.ply"
        position="0 0 -2"
        rotation="-90 -20 0">
      ></a-entity>

      <a-entity ply-model="src: Cloud_1.ply" position="5 -11 3" rotation="-90 0 0"></a-entity>
      <a-entity ply-model="src: Cloud_1.ply" position="-3 3 33" rotation="-90 0 0"></a-entity>
      <a-entity ply-model="src: Cloud_1.ply" position="9 16 2" rotation="-90 0 0" scale="3 4 8"></a-entity>
      <a-entity ply-model="src: Cloud_1.ply" position="0 0 11" rotation="-90 0 0" scale="2 2 2"></a-entity>
      <a-entity ply-model="src: Cloud_1.ply" position="-4 3 2" rotation="-90 3 21"></a-entity>
      <a-entity ply-model="src: Cloud_1.ply" position="0 5 9" rotation="-90 0 0"></a-entity>
      <a-entity ply-model="src: Cloud_1.ply" position="-4 -8 14" rotation="-90 0 0"></a-entity>
      <a-entity ply-model="src: Cloud_1.ply" position="7 7 -1" rotation="-90 0 0" scale="3 3 2"></a-entity>
      <a-entity ply-model="src: Cloud_1.ply" position="3 -9 5" rotation="-90 0 0" scale="2 2 2"></a-entity>
      <a-entity ply-model="src: Cloud_1.ply" position="-4 7 22" rotation="-90 3 21"></a-entity>
      <a-entity ply-model="src: Cloud_1.ply" position="0 5 -3" rotation="-90 0 0"></a-entity>
      <a-entity ply-model="src: Cloud_1.ply" position="2 6 -7" rotation="-90 0 0"></a-entity>
      <a-entity ply-model="src: Cloud_1.ply" position="0 -2 7" rotation="-90 0 0" scale="3 3 2"></a-entity>
      <a-entity ply-model="src: Cloud_1.ply" position="5 3 0" rotation="-90 0 0" scale="2 2 2"></a-entity>
      <a-entity ply-model="src: Cloud_1.ply" position="-4 2 2" rotation="-90 3 21"></a-entity>
      <a-entity ply-model="src: Cloud_1.ply" position="-9 2 5" rotation="-90 3 21"></a-entity>

  
      <a-entity
        ply-model="src: finished_baloon.ply"
        position="-5 0 -12"
        rotation="-90 0 0"
        scale="2 2 2"
        animation="property: position; from: -5 0 -12; to: -5 15 -12; dur: 5000; loop: true">
      ></a-entity>
    </a-scene>
  </body>
</html>
